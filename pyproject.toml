[project]
name = "vasp-attribution-engine"
version = "0.1.0"
description = "Automated attribution of unknown cryptocurrency wallets to nearest VASPs"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "httpx>=0.27",
    "arq>=0.26",
    "redis>=5.0",
    "networkx>=3.3",
    "python-dateutil>=2.9",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "neo4j>=5.20",  # M8: persistent graph store (cross-case knowledge graph)
    "pycryptodome>=3.23.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]
# M7: installed (postgres persistence). M8: neo4j installed (graph store).

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["api*", "engine*", "worker*", "reports*", "integrations*", "vasp_directory*"]
