[project]
name = "vasp-attribution-engine"
version = "0.1.0"
description = "Automated attribution of unknown cryptocurrency wallets to nearest VASPs"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "httpx>=0.27",
    "arq>=0.26",
    "redis>=5.0",
    "networkx>=3.3",
    "python-dateutil>=2.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]
# M3+ (graph persistence, DB): installed when those milestones land
#   "sqlalchemy[asyncio]>=2.0", "asyncpg>=0.29", "neo4j>=5.20",

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"
